[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lillia-full"
version = "0.1.0"
description = "A persistent, general-purpose local AI agent"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "rich>=13,<15", "prompt-toolkit>=3.0,<4", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1", "pyte>=0.8,<1"]

[project.scripts]
lillia = "lillia.cli:main"

[tool.setuptools.packages.find]
include = ["lillia*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
extend-exclude = [".lillia"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
